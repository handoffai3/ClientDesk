<!doctype html>
<html lang="en">

		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'system';
          var d = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', d);
        } catch (e) {}
      })();
    </script>

        --c-secondary-container: 219 234 254;
        --c-on-secondary: 255 255 255;
        --c-on-secondary-container: 15 95 194;

        --c-on-tertiary: 255 255 255;

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      const c = (n) => `rgb(var(--c-${n}) / <alpha-value>)`;
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: Object.fromEntries([
              'primary', 'primary-hover', 'primary-container', 'on-primary', 'on-primary-container',
              'secondary', 'secondary-container', 'on-secondary', 'on-secondary-container',
              'tertiary', 'tertiary-container', 'on-tertiary', 'on-tertiary-container',
              'error', 'error-container', 'on-error', 'on-error-container',
              'surface', 'surface-dim', 'surface-bright',
              'surface-container-lowest', 'surface-container-low', 'surface-container',
              'surface-container-high', 'surface-container-highest', 'surface-variant',
              'on-surface', 'on-surface-variant', 'on-background', 'background',
              'outline', 'outline-variant', 'inverse-surface', 'inverse-on-surface', 'inverse-primary',
              'success', 'success-container'

            },
            maxWidth: {
              "container-max": "1200px"
            }
          }
        }
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..24,400,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
